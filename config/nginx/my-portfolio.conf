# Nginx — my-portfolio (Fakhri Ramdani Web CV)
# Static hosting of the Next.js `output: 'export'` build. The deploy points
# `root` at the versioned directory behind the `current` symlink, so an
# atomic `ln -sfn` swap flips releases with no downtime (TECH-SPEC §5).

server {
    listen 80;
    listen [::]:80;
    server_name fakhriramdani.web.id;

    # HTTP -> HTTPS redirect (NFR-10).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fakhriramdani.web.id;

    # TLS: certbot-managed certs (issued after DNS points fakhriramdani.web.id here).
    ssl_certificate     /etc/letsencrypt/live/fakhriramdani.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fakhriramdani.web.id/privkey.pem;

    # ---- Security headers (NFR-10, AC-016.6) --------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP: no unsafe-eval, no unsafe-inline in script-src (TECH-SPEC §4.4, NFR-10).
    # The export is HTML+CSS only; enhance.js is served as a plain static file,
    # so script-src 'self' (no unsafe-inline) is safe and correct.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Root is the current versioned release (symlink target).
    root /var/www/my-portfolio/current;

    # ---- Gzip (NFR-03 payload budget) ---------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- Access log retention is handled by logrotate (14 days, NFR-12). ----
    access_log /var/log/nginx/my-portfolio.access.log;
    error_log  /var/log/nginx/my-portfolio.error.log;

    # ---- CV PDF: long cache (NFR-15) ---------------------------------------
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- Immutable static assets -------------------------------------------
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Fonts --------------------------------------------------------------
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 404 page (FR-015) --------------------------------------------------
    error_page 404 /404.html;

    # ---- 403 page (TASK-218) ------------------------------------------------
    error_page 403 /403.html;

    # ---- SPA-less static site: serve index.html for directories -------------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}
