# Nginx — container (HTTP-only) for the Docker image / local preview.
#
# TLS termination is expected to happen upstream (host reverse proxy, LB, or
# the VPS Nginx). Use `config/nginx/my-portfolio.conf` for the TLS-terminating
# production host. Headers and caching rules mirror that file minus TLS.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (NFR-10, AC-016.6) --------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP: no unsafe-eval, no unsafe-inline in script-src (TECH-SPEC §4.4, NFR-10).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- CV PDF (NFR-15) ----------------------------------------------------
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- Immutable static assets -------------------------------------------
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 404 page (FR-015) --------------------------------------------------
    error_page 404 /404.html;

    # ---- 403 page (TASK-218) ------------------------------------------------
    error_page 403 /403.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}
