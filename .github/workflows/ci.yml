name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint · Typecheck · Validate · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate conventional commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}

      - name: Typecheck
        run: npm run typecheck

      - name: Validate content & assets
        run: npm run validate

      - name: Token, contrast & font guard (TECH-SPEC §7.4 gate 4)
        run: |
          npm run check-tokens

      - name: Unit tests
        run: npm test

  build:
    name: Build (static export) + smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Smoke (static output, budgets, secret grep, CSP)
        run: npm run smoke

      - name: Render smoke - headless Chrome content, CSS, 0 JS (CSP render)
        run: node scripts/render-smoke.js

      - name: Secret scan on client bundle (AC-016.6)
        run: |
          if [ -d out/_next/static ] && grep -rIlE 'SECRET|TOKEN|PRIVATE KEY' out/_next/static; then
            echo "::error::secret material found in client bundle"
            exit 1
          fi
          echo "OK: no secrets in bundle"

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets (NFR-01/02/04)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy:
    name: Deploy (atomic symlink swap)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, lighthouse]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out/

      - name: Deploy via rsync + atomic symlink swap
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          VERSION_DIR="v_$(date +%Y%m%d%H%M%S)"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"

          # 1. Upload the static build to a new versioned directory.
          ssh "$REMOTE" "mkdir -p '$DEPLOY_ROOT/$VERSION_DIR'"
          rsync -az --delete out/ "$REMOTE:$DEPLOY_ROOT/$VERSION_DIR/"

          # 2. Atomic symlink swap (previous build stays live until this point).
          ssh "$REMOTE" "ln -sfn '$DEPLOY_ROOT/$VERSION_DIR' '$DEPLOY_ROOT/current'"

          # 3. Verify the swap succeeded.
          ssh "$REMOTE" "test -f '$DEPLOY_ROOT/current/index.html'"
